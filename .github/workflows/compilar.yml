name: Compilar el mod

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compilar:
    name: Compilar Minecraft Forge 1.20.1
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compilar
        run: gradle build --no-daemon
      - name: Guardar el mod compilado
        uses: actions/upload-artifact@v4
        with:
          name: los-tres-arquitectos-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
